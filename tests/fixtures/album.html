o the page on the web store.\\n\\nGithub - https://github.com/Tdortiz/Imgur-Album-Links\\nGoogle App Store - https://chrome.google.com/webstore/detail/imgur-album-links/ipfbdfnhlhkmhebffcbnbcgimpodlgep\\nIf anyone wants to help work on this extension feel free to contribute to the repository with pull requests and we can peer review them together and merge the changes. I\'d love to make this into a bigger project to show off.\\n\\nIf enough interest is shown, I\'ll look into creating an extension on other web browsers as well.\\n\\nWhat this extension does:\\nEver want to view an Imgur user\'s albums but forgot the url to get to their albums? \\n\\nThis extension fixes that issue by adding links to a user\'s albums in a few locations:\\n\\n1. On their gallery page at imgur.com/user/\\u003cUsername\\u003e a new menu will appear with an \\\"Albums\\\" link.\\n\\n2. While browsing the gallery an \\\"Albums\\\" link will appear next to the username and timestamp.\\n\\n3. While browsing the gallery if you right click the page a context menu will pop up with an option to \\\"View User\'s Albums Privately\\\" which will open an incognito window to the user\'s albums.\\n\\nPictures of each scenario are below.\",\"is_animated\":false,\"is_looping\":false,\"duration\":0,\"has_sound\":false},\"created_at\":\"2017-04-11T14:13:12Z\",\"updated_at\":null},\"tags\":[{\"tag\":\"albums\",\"display\":\"albums\",\"background_id\":\"IkZeAAy\",\"accent\":\"4070B5\",\"is_promoted\":false},{\"tag\":\"imgur\",\"display\":\"imgur\",\"background_id\":\"iN4Gb0k\",\"accent\":\"5B62A5\",\"is_promoted\":false},{\"tag\":\"extension\",\"display\":\"extension\",\"background_id\":\"CXErE2G\",\"accent\":\"5A3D74\",\"is_promoted\":false}],\"media\":[{\"id\":\"zdSpZqt\",\"account_id\":10430476,\"mime_type\":\"image/jpeg\",\"type\":\"image\",\"name\":\"logo-1200-630\",\"basename\":\"\",\"url\":\"https://i.imgur.com/zdSpZqt.jpeg\",\"ext\":\"jpeg\",\"width\":1200,\"height\":630,\"size\":31560,\"metadata\": ":\"https://i.imgur.com/TUf9TF8.png\",\"ext\":\"png\",\"width\":1280,\"height\":800,\"size\":452005,\"metadata\":{\"title\":\"\",\"description\":\"Gallery\'s Album Links\\n\\n1) The first one is underneath the title with the rest of the meta-data. This will redirect you to the image author\'s albums.\\n\\n2) The other is accessible by right clicking on the website. This opens up a new incognito window at the image author\'s albums.\",\"is_animated\":false,\"is_looping\":false,\"duration\":0,\"has_sound\":false},\"created_at\":\"2017-04-11T14:09:08Z\",\"updated_at\":null},{\"id\":\"INqD4Ys\",\"account_id\":10430476,\"mime_type\":\"image/png\",\"type\":\"image\",\"name\":\"profile\",\"basename\":\"\",\"url\":\"https://i.imgur.com/INqD4Ys.png\",\"ext\":\"png\",\"width\":1280,\"height\":800,\"size\":83473,\"metadata\":{\"title\":\"\",\"description\":\"User Profile Album Link\\n\\n3) I figured while I\'m at it I should add an albums link on the user\'s profile as well. I kept the styling the same as Imgur\'s so the extra links flows into the design well.\",\"is_animated\":false,\"is_looping\":false,\"duration\":0,\"has_sound\":false},\"created_at\":\"2017-04-11T14:09:04Z\",\"updated_at\":null}],\"display\":[]}"</script></body></html>
